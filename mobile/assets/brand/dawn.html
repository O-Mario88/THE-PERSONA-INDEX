<!doctype html>
<html>
<body style="margin:0;background:#000">
<canvas id="c"></canvas>
<script>
// A sunrise over misty forested ridges, after Edwin's loading-screen mockup.
// Scene units: v = y / H, u = (x - sunX * W) / H, so a tall phone image and a
// wide desktop image share the same hills around the sun.
const P = Object.fromEntries(new URLSearchParams(location.hash.slice(1)))
const W = +P.W, H = +P.H, SUNX = +P.sun, SEED = +(P.seed || 7)
const cv = document.getElementById('c')
cv.width = W; cv.height = H
let ctx = cv.getContext('2d')

// Seeded randomness and 1D value noise.
function mulberry(a) { return () => { a |= 0; a = (a + 0x6d2b79f5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296 } }
const rand = mulberry(SEED * 9973)
function h1(i, s) { let x = Math.imul((i | 0) ^ Math.imul(s, 0x9e3779b1), 0x27d4eb2d); x ^= x >>> 15; x = Math.imul(x, 0x85ebca6b); x ^= x >>> 13; x = Math.imul(x, 0xc2b2ae35); x ^= x >>> 16; return (x >>> 0) / 4294967296 }
function vnoise(x, s) { const i = Math.floor(x), f = x - i, t = f * f * (3 - 2 * f); return h1(i, s) * (1 - t) + h1(i + 1, s) * t }
function fbm(x, s, oct = 6) { let a = 1, f = 1, sum = 0, n = 0; for (let o = 0; o < oct; o++) { sum += a * vnoise(x * f, s + o * 1013); n += a; a *= 0.5; f *= 2.07 } return sum / n }
const clamp = (x, a, b) => Math.max(a, Math.min(b, x))
const smooth = (e0, e1, x) => { const t = clamp((x - e0) / (e1 - e0), 0, 1); return t * t * (3 - 2 * t) }
const mix = (a, b, t) => a + (b - a) * t
function hex(c) { const n = parseInt(c.slice(1), 16); return [(n >> 16) & 255, (n >> 8) & 255, n & 255] }
function rgba(c, a = 1) { const [r, g, b] = Array.isArray(c) ? c : hex(c); return `rgba(${r | 0},${g | 0},${b | 0},${a})` }
function mixc(c1, c2, t) { const a = Array.isArray(c1) ? c1 : hex(c1), b = Array.isArray(c2) ? c2 : hex(c2); return [mix(a[0], b[0], t), mix(a[1], b[1], t), mix(a[2], b[2], t)] }

const X = (u) => SUNX * W + u * H
const U = (x) => (x - SUNX * W) / H
const HORIZON = 0.68
const SUN = { x: X(0), y: (HORIZON + 0.001) * H }

// 1. The sky: pale blue at the top, cream through the middle, warm at the hills.
function sky() {
  const g = ctx.createLinearGradient(0, 0, 0, H)
  const stops = [[0, '#ccd9e7'], [0.1, '#d6dfe9'], [0.22, '#e6eaef'], [0.33, '#f3f2f0'], [0.42, '#faf6f0'], [0.52, '#faf2e9'], [0.6, '#fcf0e0'], [0.65, '#fcecd1'], [0.69, '#f8e0bb'], [0.8, '#e9d2b4'], [1, '#cdbba6']]
  for (const [o, c] of stops) g.addColorStop(o, c)
  ctx.fillStyle = g
  ctx.fillRect(0, 0, W, H)
  // Warmth spreading from the sun.
  const r = ctx.createRadialGradient(SUN.x, SUN.y, 0, SUN.x, SUN.y, H * 0.55)
  r.addColorStop(0, 'rgba(255,236,170,0.75)')
  r.addColorStop(0.18, 'rgba(255,233,175,0.45)')
  r.addColorStop(0.5, 'rgba(255,240,205,0.16)')
  r.addColorStop(1, 'rgba(255,245,225,0)')
  ctx.fillStyle = r
  ctx.fillRect(0, 0, W, H)
}

function sun() {
  const r1 = ctx.createRadialGradient(SUN.x, SUN.y, 0, SUN.x, SUN.y, H * 0.14)
  r1.addColorStop(0, 'rgba(255,255,246,1)')
  r1.addColorStop(0.07, 'rgba(255,254,240,1)')
  r1.addColorStop(0.1, 'rgba(255,246,205,0.9)')
  r1.addColorStop(0.2, 'rgba(255,236,180,0.6)')
  r1.addColorStop(0.4, 'rgba(255,228,160,0.28)')
  r1.addColorStop(1, 'rgba(255,225,160,0)')
  ctx.fillStyle = r1
  ctx.beginPath(); ctx.arc(SUN.x, SUN.y, H * 0.14, 0, Math.PI * 2); ctx.fill()
}

// A ridge as a function of x in pixels.
function ridge(base, amp, freq, seed, oct = 6) {
  return (x) => (base(U(x)) + (fbm(U(x) * freq + 10, seed, oct) - 0.5) * 2 * amp) * H
}

function fillRidge(ry, top, bottom, alpha = 1, to = H) {
  ctx.beginPath()
  ctx.moveTo(0, to)
  const step = Math.max(1, W / 1600)
  let minY = H
  for (let x = 0; x <= W + step; x += step) { const y = ry(x); minY = Math.min(minY, y); ctx.lineTo(x, y) }
  ctx.lineTo(W, to)
  ctx.closePath()
  const g = ctx.createLinearGradient(0, minY, 0, Math.min(to, minY + H * 0.12))
  g.addColorStop(0, rgba(top, alpha))
  g.addColorStop(1, rgba(bottom, alpha))
  ctx.fillStyle = g
  ctx.fill()
}

// Mist lying in the valley below a ridge.
function mist(v0, v1, color, alpha) {
  const g = ctx.createLinearGradient(0, v0 * H, 0, v1 * H)
  g.addColorStop(0, rgba(color, 0))
  g.addColorStop(0.55, rgba(color, alpha * 0.8))
  g.addColorStop(1, rgba(color, alpha))
  ctx.fillStyle = g
  ctx.fillRect(0, v0 * H, W, (v1 - v0) * H)
  // Wisps: soft horizontal streaks that thin out unevenly.
  ctx.save()
  ctx.filter = `blur(${(H * 0.006).toFixed(1)}px)`
  for (let i = 0; i < 26; i++) {
    const y = mix(v0, v1, 0.35 + rand() * 0.6) * H
    const x = rand() * W
    const w = H * (0.12 + rand() * 0.3), h = H * (0.004 + rand() * 0.01)
    ctx.fillStyle = rgba(color, alpha * (0.25 + rand() * 0.35))
    ctx.beginPath(); ctx.ellipse(x, y, w, h, 0, 0, Math.PI * 2); ctx.fill()
  }
  ctx.restore()
}

// Light from the sun on a slope: stronger near the sun, on the sun side.
function sunlit(x, y) {
  const d = Math.hypot((x - SUN.x) / H, (y - SUN.y) / H)
  return clamp(1 - d / 0.42, 0, 1) ** 1.6
}

// A conifer: a narrow, slightly ragged spire. Its sun side is lit.
function crown(x, y, h, base, lit) {
  const w = h * (0.55 + rand() * 0.3)
  ctx.beginPath()
  ctx.ellipse(x, y - h * 0.5, w / 2, h / 2, 0, 0, Math.PI * 2)
  ctx.fillStyle = rgba(base)
  ctx.fill()
  if (lit > 0.02) {
    ctx.beginPath()
    ctx.ellipse(x + w * 0.14, y - h * 0.58, w * 0.3, h * 0.36, 0, 0, Math.PI * 2)
    ctx.fillStyle = rgba('#c9b06e', lit * 0.35)
    ctx.fill()
  }
}

function conifer(x, y, h, base, lit, alpha = 1) {
  if (rand() < 0.3) return crown(x, y, h * 0.8, base, lit)
  const w = h * (0.34 + rand() * 0.16)
  const tiers = 4
  ctx.beginPath()
  ctx.moveTo(x, y - h)
  for (let i = 1; i <= tiers; i++) {
    const t = i / tiers
    const yy = y - h + h * t
    const ww = (w / 2) * t * (0.9 + rand() * 0.25)
    ctx.lineTo(x + ww, yy)
    if (i < tiers) ctx.lineTo(x + ww * 0.55, yy - h * 0.02)
  }
  ctx.lineTo(x - (w / 2) * (0.9 + rand() * 0.2), y)
  for (let i = tiers - 1; i >= 1; i--) {
    const t = i / tiers
    const yy = y - h + h * t
    const ww = (w / 2) * t * (0.9 + rand() * 0.25)
    ctx.lineTo(x - ww * 0.55, yy - h * 0.02)
    ctx.lineTo(x - ww, yy)
  }
  ctx.closePath()
  ctx.fillStyle = rgba(base, alpha)
  ctx.fill()
  if (lit > 0.02) {
    ctx.beginPath()
    ctx.moveTo(x, y - h)
    ctx.lineTo(x + w * 0.5, y)
    ctx.lineTo(x + w * 0.05, y)
    ctx.closePath()
    ctx.fillStyle = rgba('#cdb070', alpha * lit * (0.25 + rand() * 0.25))
    ctx.fill()
  }
}

// A forested slope: tree tops along the ridge, crowns packed below it.
function forest(ry, opts) {
  const { minH, maxH, gap, base, deep, rows, depth, litScale = 1 } = opts
  // The body of the slope.
  fillRidge(ry, base, deep, 1)
  // Packed crowns: back rows first, then rows lower down.
  for (let r = rows; r >= 0; r--) {
    const off = (r / rows) * depth * H
    for (let x = -gap; x < W + gap; x += gap * (0.55 + rand() * 0.9)) {
      const y = ry(x) + off + (rand() - 0.3) * maxH * 0.5
      const h = mix(minH, maxH, rand()) * (1 + (r / rows) * 0.25)
      const shade = clamp(0.15 + (r / rows) * 0.7 + (rand() - 0.5) * 0.3, 0, 1)
      const c = mixc(base, deep, shade)
      conifer(x, y + h * 0.15, h, c, sunlit(x, y) * litScale * (1 - (r / rows) * 0.6))
    }
  }
}

function rays() {
  ctx.save()
  ctx.globalCompositeOperation = 'screen'
  ctx.filter = `blur(${(H * 0.004).toFixed(1)}px)`
  for (let i = 0; i < 9; i++) {
    const a = Math.PI * (0.52 + i * 0.045 + rand() * 0.02)
    const len = H * (0.12 + rand() * 0.16)
    const spread = 0.008 + rand() * 0.01
    ctx.beginPath()
    ctx.moveTo(SUN.x, SUN.y)
    ctx.lineTo(SUN.x + Math.cos(a - spread) * len, SUN.y + Math.sin(a - spread) * len)
    ctx.lineTo(SUN.x + Math.cos(a + spread) * len, SUN.y + Math.sin(a + spread) * len)
    ctx.closePath()
    const g = ctx.createRadialGradient(SUN.x, SUN.y, 0, SUN.x, SUN.y, len)
    g.addColorStop(0, 'rgba(255,236,180,0.32)')
    g.addColorStop(1, 'rgba(255,236,180,0)')
    ctx.fillStyle = g
    ctx.fill()
  }
  ctx.restore()
}

// A leaf: an oval with a pointed tip, darker at the stem, lit along one edge.
function leaf(x, y, len, wid, ang, dark, light, litSide) {
  ctx.save()
  ctx.translate(x, y)
  ctx.rotate(ang)
  ctx.beginPath()
  ctx.moveTo(0, 0)
  ctx.bezierCurveTo(wid * 0.95, -len * 0.12, wid * 0.8, -len * 0.72, 0, -len)
  ctx.bezierCurveTo(-wid * 0.8, -len * 0.72, -wid * 0.95, -len * 0.12, 0, 0)
  ctx.closePath()
  const g = ctx.createLinearGradient(-wid * litSide, 0, wid * litSide, -len * 0.3)
  g.addColorStop(0, rgba(dark))
  g.addColorStop(0.6, rgba(mixc(dark, light, 0.45)))
  g.addColorStop(1, rgba(light))
  ctx.fillStyle = g
  ctx.fill()
  ctx.strokeStyle = rgba(mixc(dark, light, 0.7), 0.6)
  ctx.lineWidth = Math.max(1, wid * 0.05)
  ctx.beginPath(); ctx.moveTo(0, 0); ctx.quadraticCurveTo(wid * 0.08, -len * 0.5, 0, -len * 0.95); ctx.stroke()
  ctx.restore()
}

// A leafy branch in front, out of focus.
function branch(x0, y0, x1, y1, n, size, blur, flip, seed) {
  const r = mulberry(seed)
  ctx.save()
  ctx.filter = `blur(${blur.toFixed(1)}px)`
  const cx = mix(x0, x1, 0.5) + flip * size * 0.6, cy = mix(y0, y1, 0.5)
  ctx.strokeStyle = 'rgba(30,40,22,1)'
  ctx.lineWidth = size * 0.05
  ctx.beginPath(); ctx.moveTo(x0, y0); ctx.quadraticCurveTo(cx, cy, x1, y1); ctx.stroke()
  for (let i = 0; i < n; i++) {
    const t = 0.12 + (i / n) * 0.9
    const bx = (1 - t) * (1 - t) * x0 + 2 * (1 - t) * t * cx + t * t * x1
    const by = (1 - t) * (1 - t) * y0 + 2 * (1 - t) * t * cy + t * t * y1
    const side = i % 2 === 0 ? 1 : -1
    const len = size * (0.55 + r() * 0.45) * (1 - t * 0.35)
    const ang = side * (0.75 + r() * 0.5) + flip * 0.2 - 0.1
    const lit = r()
    const dark = lit > 0.7 ? '#24321a' : lit > 0.35 ? '#1a2412' : '#11180b'
    const light = lit > 0.7 ? '#8aa646' : lit > 0.35 ? '#4a6029' : '#2a3818'
    leaf(bx, by, len, len * 0.44, ang, dark, light, side)
  }
  // A leaf at the tip.
  leaf(x1, y1, size * 0.6, size * 0.25, flip * 0.2, '#1f2b16', '#71903a', 1)
  ctx.restore()
}

function grain(amount) {
  const img = ctx.getImageData(0, 0, W, H)
  const d = img.data
  const r = mulberry(SEED * 31)
  for (let i = 0; i < d.length; i += 4) {
    const n = (r() + r() - 1) * amount
    d[i] += n; d[i + 1] += n; d[i + 2] += n
  }
  ctx.putImageData(img, 0, 0)
}

// 2D value noise, for mist.
function h2(ix, iy, s) { return h1(Math.imul(ix, 73856093) ^ Math.imul(iy, 19349663), s) }
function vnoise2(x, y, s) { const ix = Math.floor(x), iy = Math.floor(y), fx = x - ix, fy = y - iy; const sx = fx * fx * (3 - 2 * fx), sy = fy * fy * (3 - 2 * fy); return mix(mix(h2(ix, iy, s), h2(ix + 1, iy, s), sx), mix(h2(ix, iy + 1, s), h2(ix + 1, iy + 1, s), sx), sy) }
function fbm2(x, y, s, oct = 5) { let a = 1, f = 1, sum = 0, n = 0; for (let o = 0; o < oct; o++) { sum += a * vnoise2(x * f, y * f, s + o * 101); n += a; a *= 0.5; f *= 2.1 } return sum / n }

// Uneven mist between v0 and v1: thick in places, thin in others.
function mistNoise(v0, v1, color, alpha, seed, stretch = 6) {
  const scale = 4
  const w = Math.ceil(W / scale), h = Math.ceil(((v1 - v0) * H) / scale)
  const off = document.createElement('canvas'); off.width = w; off.height = h
  const o = off.getContext('2d'); const img = o.createImageData(w, h); const d = img.data
  const [r, g, b] = hex(color)
  for (let y = 0; y < h; y++) {
    const t = y / (h - 1)
    const profile = smooth(0, 0.45, t) * (1 - 0.25 * smooth(0.6, 1, t))
    for (let x = 0; x < w; x++) {
      const n = fbm2((x * scale) / H * stretch, (y * scale) / H * stretch * 5, seed)
      const a = profile * mix(0.35, 1, smooth(0.32, 0.72, n)) * alpha
      const i = (y * w + x) * 4
      d[i] = r; d[i + 1] = g; d[i + 2] = b; d[i + 3] = a * 255
    }
  }
  o.putImageData(img, 0, 0)
  ctx.save(); ctx.imageSmoothingQuality = 'high'
  ctx.filter = `blur(${(H * 0.002).toFixed(1)}px)`
  ctx.drawImage(off, 0, v0 * H, W, (v1 - v0) * H)
  ctx.restore()
}

// A soft ridge: a filled silhouette, darker along its crest and hazier below.
function layer(ry, crest, low, fade, blur, alpha = 1) {
  ctx.save()
  if (blur > 0) ctx.filter = `blur(${blur.toFixed(1)}px)`
  ctx.beginPath(); ctx.moveTo(0, H)
  const step = Math.max(1, W / 1800)
  let minY = H
  for (let x = 0; x <= W + step; x += step) { const y = ry(x); minY = Math.min(minY, y); ctx.lineTo(x, y) }
  ctx.lineTo(W, H); ctx.closePath()
  const g = ctx.createLinearGradient(0, minY, 0, minY + fade * H)
  g.addColorStop(0, rgba(crest, alpha)); g.addColorStop(1, rgba(low, alpha))
  ctx.fillStyle = g; ctx.fill()
  ctx.restore()
}

// Trees scattered over a slope, far (higher) ones first; bigger and darker lower down.
function trees(ry, o) {
  const { n, depth, minH, maxH, top, bottom, lit = 1, blur = 0, x0 = 0, x1 = W, seed } = o
  const r = mulberry(seed)
  const list = []
  for (let i = 0; i < n; i++) {
    const x = mix(x0, x1, r())
    const k = r() ** 1.35
    const y = ry(x) + k * depth * H
    list.push([x, y, k])
  }
  list.sort((a, b) => a[1] - b[1])
  // Drawn on their own layer, then blurred once: a filter on every tree is slow.
  const main = ctx
  const off = document.createElement('canvas'); off.width = W; off.height = H
  ctx = off.getContext('2d')
  for (const [x, y, k] of list) {
    const h = mix(minH, maxH, k) * (0.65 + r() * 0.7)
    const patch = fbm2(x / H * 9, y / H * 14, seed) - 0.5
    const c = mixc(top, bottom, clamp(k * 1.1 + (r() - 0.5) * 0.35 + patch * 0.9, 0, 1))
    conifer(x, y, h, c, sunlit(x, y) * lit * (1 - k * 0.7) * clamp(1 - patch * 1.5, 0.3, 1.4))
  }
  ctx = main
  ctx.save()
  if (blur > 0) ctx.filter = `blur(${blur.toFixed(1)}px)`
  ctx.drawImage(off, 0, 0)
  ctx.restore()
}

function bloom(amount, radius) {
  const off = document.createElement('canvas'); off.width = W / 4; off.height = H / 4
  const o = off.getContext('2d'); o.filter = `blur(${radius / 4}px)`; o.drawImage(cv, 0, 0, W / 4, H / 4)
  ctx.save(); ctx.globalCompositeOperation = 'screen'; ctx.globalAlpha = amount
  ctx.imageSmoothingQuality = 'high'; ctx.drawImage(off, 0, 0, W, H); ctx.restore()
}

// The hills, far to near. Each base is a function of u (scene units from the sun).
sky()
// Away from the sun the hills rise and fall more, so a wide window gets peaks, not flat bands.
const relief = (u, s) => 0.024 * (fbm(u * 1.7 + 3, SEED + s * 7, 3) - 0.5) * 2 * smooth(0.08, 0.6, -u)
const R = (base, amp, freq, s, oct) => ridge((u) => base(u) + relief(u, s), amp, freq, SEED + s, oct)
layer(R((u) => 0.664 + 0.03 * Math.tanh((u + 0.1) / 0.1) - 0.016 * Math.exp(-(((u + 0.27) / 0.09) ** 2)), 0.016, 2.4, 1, 7), '#c7bab8', '#e8d9cc', 0.05, H * 0.0012, 0.85)
mistNoise(0.655, 0.705, '#f6e9da', 0.55, SEED + 21)
layer(R((u) => 0.683 + 0.032 * Math.tanh((u + 0.08) / 0.1) - 0.014 * Math.exp(-(((u + 0.36) / 0.07) ** 2)), 0.018, 2.9, 2, 7), '#b3aeb3', '#dcd5d0', 0.05, H * 0.001, 0.92)
mistNoise(0.675, 0.725, '#eee6df', 0.6, SEED + 22)
layer(R((u) => 0.703 + 0.026 * Math.tanh((u + 0.16) / 0.1), 0.02, 3.4, 3, 7), '#959ca7', '#cfd0d3', 0.045, H * 0.0008)
mistNoise(0.698, 0.748, '#e6e6e7', 0.62, SEED + 23)
sun()
const m1 = R((u) => 0.726 + 0.02 * Math.tanh((u + 0.14) / 0.1), 0.022, 4.1, 4, 7)
layer(m1, '#6f8197', '#b3bcc6', 0.04, H * 0.0006)
trees(m1, { n: 2600, depth: 0.012, minH: 0.003 * H, maxH: 0.006 * H, top: '#5d7088', bottom: '#7d8ea2', lit: 0.3, blur: H * 0.0005, seed: SEED + 31 })
mistNoise(0.722, 0.77, '#dde1e5', 0.45, SEED + 24)
const m2 = R((u) => 0.748 + 0.012 * Math.tanh((u + 0.1) / 0.1), 0.024, 4.8, 5, 7)
layer(m2, '#40556a', '#5d6f82', 0.05, H * 0.0004)
trees(m2, { n: 5200, depth: 0.03, minH: 0.004 * H, maxH: 0.009 * H, top: '#34495d', bottom: '#2a3b4b', lit: 0.5, blur: H * 0.0004, seed: SEED + 32 })
mistNoise(0.752, 0.8, '#d2d9df', 0.32, SEED + 25)
const m3 = R((u) => 0.772 + 0.03 * Math.exp(-(((u + 0.33) / 0.06) ** 2)) * -1 + 0.012 * Math.tanh((u + 0.2) / 0.05), 0.016, 6, 9, 7)
layer(m3, '#2f4253', '#22313d', 0.05, 0)
trees(m3, { n: 6000, depth: 0.04, minH: 0.005 * H, maxH: 0.011 * H, top: '#2d4152', bottom: '#1d2b36', lit: 0.4, blur: H * 0.0003, seed: SEED + 36 })
mistNoise(0.78, 0.83, '#cdd4da', 0.22, SEED + 26)
// The big slope rising towards the sun, lit along its crest.
const near = R((u) => (u >= 0.08 ? 0.698 + 0.06 * smooth(0.08, 0.55, u) : 0.698 + 0.135 * smooth(0.08, -0.28, u)), 0.006, 7, 6, 7)
layer(near, '#24384a', '#122029', 0.08, 0)
trees(near, { n: 14000, depth: 0.16, minH: 0.006 * H, maxH: 0.019 * H, top: '#2b4152', bottom: '#0f1c23', lit: 1.15, blur: H * 0.00034, seed: SEED + 33 })
rays()
// The forest in front: a lower ridge, then the nearest crowns.
const f0 = R(() => 0.83, 0.02, 5, 7, 6)
layer(f0, '#1d2e33', '#0d181c', 0.06, 0)
trees(f0, { n: 8000, depth: 0.1, minH: 0.012 * H, maxH: 0.03 * H, top: '#22353a', bottom: '#0b1518', lit: 0.8, blur: H * 0.0003, seed: SEED + 34 })
const f1 = R(() => 0.895, 0.02, 4, 8, 5)
layer(f1, '#132124', '#060d0f', 0.06, 0)
trees(f1, { n: 3200, depth: 0.12, minH: 0.024 * H, maxH: 0.055 * H, top: '#18282a', bottom: '#050b0c', lit: 0.5, seed: SEED + 35 })
bloom(0.22, H * 0.02)

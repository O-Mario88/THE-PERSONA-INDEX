<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="stylesheet" href="/app.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>The Persona Index</title>
    <meta name="description" content="Three everyday questions in the morning and three in the evening, and what your answers say about you." />
    <meta name="theme-color" content="#013d5a" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Persona Index" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
  </head>
  <body>
    <noscript>The Persona Index needs JavaScript turned on.</noscript>
    <div id="root">
      <!-- The launch's first frame: midnight and the sprout, exactly where the
           app's own launch (src/screens/Launch.tsx) starts once it has loaded.
           The app replaces this the moment it draws. -->
      <div class="boot" aria-hidden="true">
        <svg viewBox="0 0 100 100">
          <defs>
            <linearGradient id="boot-d" x1="0.05" y1="0.1" x2="0.9" y2="0.95"><stop offset="0" stop-color="#2A6631" /><stop offset="1" stop-color="#43923F" /></linearGradient>
            <linearGradient id="boot-l" x1="0.95" y1="0" x2="0.1" y2="1"><stop offset="0" stop-color="#D6F462" /><stop offset="0.5" stop-color="#AEDF4C" /><stop offset="1" stop-color="#5BA539" /></linearGradient>
            <linearGradient id="boot-s" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#72B841" /><stop offset="1" stop-color="#3F8B3A" /></linearGradient>
            <mask id="boot-v" maskUnits="userSpaceOnUse" x="0" y="0" width="100" height="100"><rect width="100" height="100" fill="#fff" /><path d="M51.5 71 C55 54 65 36 80 21" fill="none" stroke="#000" stroke-width="1.9" stroke-linecap="round" /></mask>
          </defs>
          <path d="M48 94 C47 82 47.5 70 50.5 60" fill="none" stroke="url(#boot-s)" stroke-width="3.6" stroke-linecap="round" />
          <path d="M46.5 63 C28 68 4 52 4 19 C26 18 44 36 46.5 63 Z" fill="url(#boot-d)" />
          <path d="M49.5 76 C79 70 96 42 94 4 C63 12 44 42 49.5 76 Z" fill="url(#boot-l)" mask="url(#boot-v)" />
        </svg>
      </div>
    </div>
  </body>
</html>

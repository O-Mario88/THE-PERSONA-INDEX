# The native apps, for XcodeGen: `cd apple && xcodegen` writes
# PersonaIndex.xcodeproj. One SwiftUI app for iPhone, iPad and Mac, on the
# PersonaKit package (models, the API client, storage, the day's windows).
name: PersonaIndex
options:
  bundleIdPrefix: com.personaindex
  deploymentTarget:
    iOS: "18.0"
    macOS: "15.0"
  createIntermediateGroups: true
packages:
  PersonaKit:
    path: PersonaKit
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
targets:
  PersonaIndex:
    type: application
    supportedDestinations: [iOS, macOS]
    sources:
      - path: PersonaIndex
      # The widget faces, for the debug snapshot of them on a Mac.
      - path: PersonaWidgets/DayWidgetFace.swift
    dependencies:
      - package: PersonaKit
      - target: PersonaWidgets
        embed: true
    info:
      path: PersonaIndex/Info.plist
      properties:
        CFBundleDisplayName: Persona Index
        LSApplicationCategoryType: public.app-category.lifestyle
        # The launch screen is the page colour, white or navy, so there is no
        # white flash in dark mode.
        UILaunchScreen:
          UIColorName: LaunchBackground
        # Figtree is declared, not registered in code at launch: the system
        # loads each face when it is first drawn.
        UIAppFonts: [Figtree-Regular.ttf, Figtree-Medium.ttf, Figtree-SemiBold.ttf, Figtree-Bold.ttf, Figtree-ExtraBold.ttf, Figtree-Black.ttf]
        ATSApplicationFontsPath: "."
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        # Where the Go API lives. A local run talks to `go run .` on this Mac.
        PIApiBase: http://localhost:8080
        # Speak, in Reflect: on the device only.
        NSMicrophoneUsageDescription: Speak lets you dictate a reflection. Your voice is turned into words on this device and never sent or kept.
        NSFaceIDUsageDescription: The app lock opens The Persona Index with Face ID. It is checked by this device; nothing is sent.
        NSSpeechRecognitionUsageDescription: Speak turns your voice into words on this device only. Nothing you say is sent or kept.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        # The widgets open the app at Today or the Mirrors.
        CFBundleURLTypes:
          - CFBundleURLName: com.personaindex.app
            CFBundleURLSchemes: [personaindex]
    entitlements:
      path: PersonaIndex/PersonaIndex.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
        com.apple.security.device.audio-input: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.personaindex.app
        PRODUCT_NAME: PersonaIndex
        # No app icon yet; the asset catalog holds only the launch colour.
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
        ENABLE_PREVIEWS: YES
        CODE_SIGN_IDENTITY: "-"
  # The widgets: what the clock knows, never anything the person answered.
  PersonaWidgets:
    type: app-extension
    supportedDestinations: [iOS, macOS]
    sources:
      - path: PersonaWidgets
      - path: PersonaIndex/Design/Tokens.swift
      - path: PersonaIndex/Resources/Fonts
        buildPhase: resources
    dependencies:
      - package: PersonaKit
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
    info:
      path: PersonaWidgets/Info.plist
      properties:
        CFBundleDisplayName: Persona Index
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
        UIAppFonts: [Figtree-Regular.ttf, Figtree-Medium.ttf, Figtree-SemiBold.ttf, Figtree-Bold.ttf, Figtree-ExtraBold.ttf, Figtree-Black.ttf]
        ATSApplicationFontsPath: "."
    entitlements:
      path: PersonaWidgets/PersonaWidgets.entitlements
      properties:
        com.apple.security.app-sandbox: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.personaindex.app.widgets
        PRODUCT_NAME: PersonaWidgets
        SKIP_INSTALL: YES
        CODE_SIGN_IDENTITY: "-"

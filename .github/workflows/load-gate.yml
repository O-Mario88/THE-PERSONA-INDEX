name: load-gate

on:
  workflow_dispatch:
    inputs:
      rate:
        description: votes per second
        default: "1000"
      duration:
        description: how long to send votes
        default: 60s
      ratings:
        description: share of answers followed by a That's me / Partly / Not me tap
        default: "1"
      mirrors:
        description: share of phones that read their weekly mirror after their third answer
        default: "0.2"

jobs:
  load:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: persona_load
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 2s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
      - run: go build -o api . && go build -o loadgen ./cmd/loadgen
      - name: start the API
        run: ./api > api.log 2>&1 &
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/persona_load?sslmode=disable
          DEVICE_TOKEN_SECRET: ci-only-secret-0123456789abcdef0123
          DATA_KEY_SECRET: ci-only-data-key-0123456789abcdef0123
          TRUST_CF_CONNECTING_IP: "1"
      - run: for i in $(seq 30); do curl -sf localhost:8080/api/health && break; sleep 1; done
      # Inputs reach the shell as variables, never pasted into the script.
      - run: ./loadgen -url http://localhost:8080 -rate "$RATE" -duration "$DURATION" -ratings "$RATINGS" -mirrors "$MIRRORS"
        env:
          RATE: ${{ inputs.rate }}
          DURATION: ${{ inputs.duration }}
          RATINGS: ${{ inputs.ratings }}
          MIRRORS: ${{ inputs.mirrors }}
      - if: always()
        run: tail -50 api.log
